config: d1
onboard:
    # --------------------------------- #
    # ----------- Controller ---------- #
    # --------------------------------- #
  control:
  # ----- Low Level Controller ----- #
    - pkg: d1_control
      executable: controller
      publishers:
        - ros_parameter: pub_ctrl_setting
          topic: /obelisk/d1/ctrl
          history_depth: 10
          callback_group: None
      subscribers:
        - ros_parameter: sub_est_setting
          topic: /obelisk/d1/est
          history_depth: 10
          callback_group: None
        # ----- Joystick subscriber ----- #
        - ros_parameter: sub_vel_cmd_setting
          topic: /obelisk/d1/high_level_ctrl
          key: sub_vel_cmd_key
          history_depth: 10
          callback_group: None
      timers:
        - ros_parameter: timer_ctrl_setting
          timer_period_sec: 0.1 # FIXME: revert to 0.002
          callback_group: None
  # ----- High Level and Execution FSM Controller ----- #
    - pkg: obelisk_unitree_cpp
      executable: obelisk_unitree_joystick
      params:
        v_x_max: 1.0
        v_y_max: 0.4
        w_z_max: 0.5
      # callback groups:
      publishers:
      # ----- Execution FSM ----- #
        - ros_parameter: pub_exec_fsm_setting
          topic: /obelisk/d1/exec_fsm
          history_depth: 10
          callback_group: None
      # ----- High Level Control ----- #
        - ros_parameter: pub_ctrl_setting
          topic: /obelisk/d1/high_level_ctrl
          history_depth: 10
          callback_group: None
      subscribers:
      # ----- Joystick subscriber ----- #
        - ros_parameter: sub_est_setting
          topic: /obelisk/d1/joy
      timers:
        - ros_parameter: timer_ctrl_setting
          timer_period_sec: 100 # Controll callback is not being used
          callback_group: None
  # --------------------------------- #
  # ----------- Estimator ----------- #
  # --------------------------------- #    
  estimation:
    # The two lines below work as well.
    # - pkg: obelisk_unitree_cpp
    #   executable: unitree_example_estimator
    - pkg: d1_control
      executable: estimator
      publishers:
        - ros_parameter: pub_est_setting
          topic: /obelisk/d1/est
          history_depth: 10
          callback_group: None
      subscribers:
        - ros_parameter: sub_sensor_setting
          topic: /obelisk/d1/joint_encoders
          history_depth: 10
          callback_group: None
      timers:
        - ros_parameter: timer_est_setting
          timer_period_sec: 0.001
          callback_group: None
  # --------------------------------- #
  # ------------- Robot ------------- #
  # --------------------------------- #
  robot:
    # === simulation ===
    # - is_simulated: True
    #   pkg: obelisk_sim_py
    #   executable: obelisk_mujoco_robot
    #   params:
    #     ic_keyframe: zero
    # === hardware ===
    - is_simulated: False
      pkg: obelisk_unitree_cpp
      executable: unitree_d1_hardware
      params:
          network_interface_name: enx001cc24ce09a
    # ===============
      publishers: # for hardware only
        - ros_parameter: pub_sensor_setting
          topic: /obelisk/d1/joint_encoders
          history_depth: 10
          callback_group: None
      subscribers:
        # ----- Control ----- #
        - ros_parameter: sub_ctrl_setting
          topic: /obelisk/d1/ctrl
          history_depth: 10
          callback_group: None
        # ----- Execution FSM ----- #
        - ros_parameter: sub_fsm_setting
          topic: /obelisk/d1/exec_fsm
          history_depth: 10
          callback_group: None
        # ----- High Level Control ----- #
        - ros_parameter: sub_high_level_ctrl_setting
          topic: /obelisk/d1/high_level_ctrl
          history_depth: 10
          callback_group: None
      sim: 
        - ros_parameter: mujoco_setting
          n_u: 8 # Number of joint positions for visualization.
          time_step: 0.002
          num_steps_per_viz: 5
          robot_pkg: d1_description
          model_xml_path: scene.xml
          sensor_settings:
          - topic: /obelisk/d1/joint_encoders
            dt: 0.002
            msg_type: ObkJointEncoders
            sensor_names:
              joint1_sensor: jointpos
              joint2_sensor: jointpos
              joint3_sensor: jointpos
              joint4_sensor: jointpos
              joint5_sensor: jointpos
              joint6_sensor: jointpos
              gripper1_sensor: jointpos
              gripper2_sensor: jointpos
      timers:
        - ros_parameter: timer_sensor_setting
          timer_period_sec: 0.02
          callback_group: None
  viz:
    on: True
    viz_tool: foxglove
    # viz_tool: rviz
    # rviz_pkg: obelisk_ros
    # rviz_config: basic_obk_config.rviz
    viz_nodes:
      - pkg: obelisk_viz_cpp
        executable: default_robot_viz
        robot_pkg: d1_description
        urdf: d1.urdf
        robot_topic: robot_description
        subscribers:
          - ros_parameter: sub_viz_est_setting
            topic: /obelisk/d1/est
            history_depth: 10
            callback_group: None
            non_obelisk: False
        publishers:
          - ros_parameter: pub_viz_joint_setting
            topic: /obelisk/d1/joint_states
            history_depth: 10
            callback_group: None
        timers:
          - ros_parameter: timer_viz_joint_setting
            timer_period_sec: 0.01
            callback_group: None
  # --------------------------------- #
  # ----------- Joystick ------------ #
  # --------------------------------- #
  joystick:
    on: True
    pub_topic: /obelisk/d1/joy
    sub_topic: /obelisk/d1/joy_feedback